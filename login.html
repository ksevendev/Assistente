<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>k7-core · Acesso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #080a0f;
    --surface:  #0d1117;
    --border:   #1e2535;
    --text:     #c9d1e0;
    --muted:    #4a5568;
    --accent:   {{ palette.hex_primary }};
    --glow:     {{ palette.hex_glow }};
    --error:    #ff4757;
    --success:  #2ed573;
    --font-head: 'Syne', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 2px solid var(--accent);
    box-shadow: 0 0 40px var(--glow), 0 20px 60px rgba(0,0,0,.6);
    border-radius: 4px;
    padding: 48px 40px;
    width: 100%;
    max-width: 400px;
    position: relative;
    animation: fadeUp .4s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo {
    font-family: var(--font-head);
    font-weight: 800;
    font-size: 28px;
    letter-spacing: -1px;
    color: var(--accent);
    margin-bottom: 6px;
    text-shadow: 0 0 20px var(--glow);
  }

  .subtitle {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 36px;
  }

  .field { margin-bottom: 20px; }

  label {
    display: block;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 14px;
    padding: 12px 14px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }

  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--glow);
  }

  button[type=submit] {
    width: 100%;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 13px;
    border-radius: 3px;
    cursor: pointer;
    margin-top: 8px;
    transition: background .2s, box-shadow .2s;
  }

  button[type=submit]:hover {
    background: var(--glow);
    box-shadow: 0 0 20px var(--glow);
  }

  .alert {
    padding: 10px 14px;
    border-radius: 3px;
    font-size: 13px;
    margin-bottom: 20px;
    border-left: 3px solid;
  }
  .alert-error   { background: rgba(255,71,87,.1); border-color: var(--error); color: #ff6b7a; }
  .alert-success { background: rgba(46,213,115,.1); border-color: var(--success); color: #5dde90; }

  .node-badge {
    position: absolute;
    top: 16px;
    right: 20px;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent);
    opacity: .6;
  }
</style>
</head>
<body>
<div class="card">
  <div class="node-badge">{{ node_type.upper() }}</div>
  <div class="logo">k7-core</div>
  <div class="subtitle">Sistema de Controle · Acesso Restrito</div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST">
    <div class="field">
      <label>Usuário</label>
      <input type="text" name="username" autocomplete="username" autofocus required>
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit">Entrar →</button>
  </form>
</div>
</body>
</html>
