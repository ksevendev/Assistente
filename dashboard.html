<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K7-Core v4.1 - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-cyan: #00BCD4;
            --color-orange: #FF9800;
            --color-dark: #0D1B2A;
            --color-darker: #051E3E;
            --color-light: #F5F5F5;
            --color-white: #FFFFFF;
            --color-gray: #757575;
            --color-success: #4CAF50;
            --color-warning: #FFC107;
            --color-danger: #F44336;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--color-darker) 0%, var(--color-dark) 100%);
            color: var(--color-white);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== HEADER ===== */
        header {
            background: rgba(5, 30, 62, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 188, 212, 0.2);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-cyan), var(--color-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .logo-version {
            font-size: 0.8rem;
            color: var(--color-cyan);
            opacity: 0.8;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(0, 188, 212, 0.1);
            border-radius: 20px;
            font-size: 0.9rem;
            color: var(--color-cyan);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--color-success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding-right: 1rem;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--color-cyan), var(--color-orange));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .logout-btn {
            padding: 0.6rem 1.5rem;
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid var(--color-danger);
            color: var(--color-danger);
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .logout-btn:hover {
            background: rgba(244, 67, 54, 0.3);
            transform: translateY(-2px);
        }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* ===== SECTION TITLE ===== */
        .section-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 28px;
            background: linear-gradient(180deg, var(--color-cyan), var(--color-orange));
            border-radius: 2px;
        }

        /* ===== NODES GRID ===== */
        .nodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .node-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 188, 212, 0.2);
            border-radius: 12px;
            padding: 1.5rem;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .node-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--node-color, var(--color-cyan));
        }

        .node-card:hover {
            border-color: var(--node-color, var(--color-cyan));
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 188, 212, 0.15);
        }

        .node-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }

        .node-info {
            flex: 1;
        }

        .node-name {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .node-id {
            font-size: 0.8rem;
            color: var(--color-gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .node-status {
            display: inline-block;
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .node-status.online {
            background: rgba(76, 175, 80, 0.2);
            color: var(--color-success);
            border: 1px solid var(--color-success);
        }

        .node-status.offline {
            background: rgba(244, 67, 54, 0.2);
            color: var(--color-danger);
            border: 1px solid var(--color-danger);
        }

        .node-status.updating {
            background: rgba(255, 193, 7, 0.2);
            color: var(--color-warning);
            border: 1px solid var(--color-warning);
        }

        .node-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin: 1.5rem 0;
            padding: 1rem 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 0.75rem;
            color: var(--color-gray);
            text-transform: uppercase;
            margin-bottom: 0.25rem;
            letter-spacing: 0.5px;
        }

        .detail-value {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--color-white);
        }

        .node-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1.5rem;
        }

        .btn {
            padding: 0.6rem 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex: 1;
        }

        .btn-primary {
            background: var(--node-color, var(--color-cyan));
            color: var(--color-dark);
        }

        .btn-primary:hover {
            opacity: 0.8;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 188, 212, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--color-white);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== COMMANDS SECTION ===== */
        .commands-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 188, 212, 0.2);
            border-radius: 12px;
            padding: 2rem;
            margin-top: 3rem;
        }

        .commands-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .btn-create {
            padding: 0.7rem 1.5rem;
            background: linear-gradient(135deg, var(--color-cyan), var(--color-orange));
            color: var(--color-dark);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }

        .btn-create:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 188, 212, 0.3);
        }

        .commands-table {
            width: 100%;
            border-collapse: collapse;
        }

        .commands-table th {
            text-align: left;
            padding: 1rem;
            border-bottom: 2px solid rgba(0, 188, 212, 0.2);
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--color-gray);
            letter-spacing: 0.5px;
        }

        .commands-table td {
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .commands-table tr:hover {
            background: rgba(0, 188, 212, 0.05);
        }

        .command-name {
            color: var(--color-cyan);
            font-weight: 500;
            cursor: pointer;
        }

        .command-name:hover {
            text-decoration: underline;
        }

        /* ===== MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--color-dark);
            border: 1px solid rgba(0, 188, 212, 0.3);
            border-radius: 12px;
            padding: 2rem;
            max-width: 90vw;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
            box-shadow: var(--shadow-lg);
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(0, 188, 212, 0.2);
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--color-white);
            font-size: 1.5rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .modal-close:hover {
            color: var(--color-cyan);
        }

        /* ===== UPDATE LOG ===== */
        .update-log {
            background: rgba(13, 27, 42, 0.8);
            border: 1px solid rgba(0, 188, 212, 0.2);
            border-radius: 6px;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            max-height: 400px;
            overflow-y: auto;
            margin: 1rem 0;
            line-height: 1.6;
        }

        .log-line {
            padding: 0.25rem 0;
            animation: slideIn 0.2s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .log-info { color: var(--color-cyan); }
        .log-success { color: var(--color-success); }
        .log-warning { color: var(--color-warning); }
        .log-error { color: var(--color-danger); }

        /* ===== LOADING ===== */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: var(--color-cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .nodes-grid {
                grid-template-columns: 1fr;
            }

            .node-details {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }

            .header-left,
            .header-right {
                width: 100%;
                justify-content: space-between;
            }

            .container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="header-left">
            <div class="logo">
                K7<span style="color: var(--color-orange);">—CORE</span>
                <div class="logo-version">v4.1</div>
            </div>
            <div class="header-status">
                <div class="status-dot"></div>
                <span>Sistema Online</span>
            </div>
        </div>
        <div class="header-right">
            <div class="user-info">
                <div class="user-avatar">A</div>
                <div>
                    <div style="font-size: 0.9rem; font-weight: 500;">Admin</div>
                    <div style="font-size: 0.75rem; color: var(--color-gray);">Super User</div>
                </div>
            </div>
            <a href="/logout" class="logout-btn">Sair</a>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="container">
        <!-- NODES SECTION -->
        <section>
            <h1 class="section-title">Nós do Sistema</h1>
            <div class="nodes-grid" id="nodesGrid">
                <!-- Será preenchido por JavaScript -->
            </div>
        </section>

        <!-- COMMANDS SECTION -->
        <section class="commands-section">
            <div class="commands-header">
                <h2 class="section-title" style="margin-bottom: 0;">Gerenciador de Comandos</h2>
                <button class="btn-create" onclick="openCreateCommandModal()">+ Novo Comando</button>
            </div>
            <table class="commands-table">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Tamanho</th>
                        <th>Linhas</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="commandsTable">
                    <!-- Será preenchido por JavaScript -->
                </tbody>
            </table>
        </section>
    </main>

    <!-- MODAL: UPDATE LOG -->
    <div class="modal" id="updateModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Log de Atualização</h2>
                <button class="modal-close" onclick="closeUpdateModal()">×</button>
            </div>
            <div id="updateLogContainer">
                <div class="update-log" id="updateLog">
                    <div class="log-line log-info">[INFO] Iniciando atualização...</div>
                </div>
            </div>
            <div style="margin-top: 1.5rem; text-align: right;">
                <button class="btn btn-secondary" onclick="closeUpdateModal()">Fechar</button>
            </div>
        </div>
    </div>

    <!-- MODAL: NODE DETAILS -->
    <div class="modal" id="nodeDetailModal">
        <div class="modal-content" style="max-width: 800px;">
            <div class="modal-header">
                <h2 class="modal-title" id="nodeDetailTitle">Detalhes do Nó</h2>
                <button class="modal-close" onclick="closeNodeDetailModal()">×</button>
            </div>
            <div id="nodeDetailContent">
                <!-- Será preenchido por JavaScript -->
            </div>
        </div>
    </div>

    <!-- MODAL: EDITOR DE COMANDOS -->
    <div class="modal" id="commandEditorModal">
        <div class="modal-content" style="max-width: 900px; width: 90vw;">
            <div class="modal-header">
                <h2 class="modal-title" id="editorTitle">Editor de Comando</h2>
                <button class="modal-close" onclick="closeCommandEditor()">×</button>
            </div>
            <input type="hidden" id="commandId">
            <div style="margin-bottom: 1rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--color-gray);">ID do Comando:</label>
                <input type="text" id="commandInput" placeholder="nome_do_comando" style="width: 100%; padding: 0.7rem; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(0, 188, 212, 0.3); border-radius: 6px; color: white;">
            </div>
            <div style="margin-bottom: 1rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--color-gray);">Código:</label>
                <textarea id="commandContent" placeholder="# Digite seu código Python aqui..." style="width: 100%; height: 400px; padding: 1rem; background: rgba(13, 27, 42, 0.8); border: 1px solid rgba(0, 188, 212, 0.3); border-radius: 6px; color: white; font-family: 'Courier New', monospace; font-size: 0.9rem; resize: vertical;"></textarea>
            </div>
            <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                <button class="btn btn-secondary" onclick="closeCommandEditor()">Cancelar</button>
                <button class="btn btn-primary" onclick="saveCommand()" style="background: var(--color-success);">Salvar</button>
            </div>
        </div>
    </div>

    <script>
        // =====================================================
        // FUNCIONALIDADES PRINCIPAIS
        // =====================================================

        let currentNodeUpdate = null;
        let updateLogsInterval = null;

        // Carregar nós ao iniciar
        document.addEventListener('DOMContentLoaded', () => {
            loadNodes();
            loadCommands();
        });

        // =====================================================
        // CARREGAR NÓS
        // =====================================================

        async function loadNodes() {
            try {
                const response = await fetch('/api/nodes');
                const nodes = await response.json();
                
                const grid = document.getElementById('nodesGrid');
                grid.innerHTML = '';
                
                nodes.forEach(node => {
                    const nodeColor = node.node_id === 'seven' ? '#00BCD4' : '#FF9800';
                    const card = document.createElement('div');
                    card.className = 'node-card';
                    card.style.setProperty('--node-color', nodeColor);
                    
                    const heartbeat = node.last_heartbeat ? 
                        new Date(node.last_heartbeat).toLocaleTimeString('pt-BR') : 'Nunca';
                    
                    card.innerHTML = `
                        <div class="node-header">
                            <div class="node-info">
                                <div class="node-name">${node.name}</div>
                                <div class="node-id">${node.node_id}</div>
                            </div>
                            <span class="node-status ${node.status}">
                                ${node.status === 'online' ? '● Online' : '○ Offline'}
                            </span>
                        </div>
                        <div class="node-details">
                            <div class="detail-item">
                                <span class="detail-label">Tipo</span>
                                <span class="detail-value">${node.node_type === 'controller' ? 'Controlador' : 'Worker'}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Versão</span>
                                <span class="detail-value">v${node.version}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Uptime</span>
                                <span class="detail-value">${node.uptime}h</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Último Heartbeat</span>
                                <span class="detail-value">${heartbeat}</span>
                            </div>
                        </div>
                        <div class="node-actions">
                            <button class="btn btn-primary" style="--node-color: ${nodeColor};" onclick="openNodeDetail('${node.node_id}')">
                                📊 Detalhes
                            </button>
                            <button class="btn btn-secondary" onclick="openUpdateModal('${node.node_id}')">
                                ⬆ Update
                            </button>
                        </div>
                    `;
                    
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error('Erro ao carregar nós:', error);
            }
        }

        // =====================================================
        // UPDATE SYSTEM
        // =====================================================

        async function openUpdateModal(nodeId) {
            currentNodeUpdate = nodeId;
            document.getElementById('updateModal').classList.add('active');
            
            // Limpar logs anteriores
            document.getElementById('updateLog').innerHTML = '';
            
            // Iniciar atualização
            try {
                const response = await fetch(`/api/node/${nodeId}/update`, { method: 'POST' });
                const data = await response.json();
                
                if (data.status === 'updating') {
                    addLogLine('[INFO] Atualização iniciada...', 'info');
                    
                    // Polling para logs
                    updateLogsInterval = setInterval(() => {
                        fetchUpdateLogs(nodeId);
                    }, 500);
                }
            } catch (error) {
                addLogLine(`[ERROR] ${error.message}`, 'error');
            }
        }

        async function fetchUpdateLogs(nodeId) {
            try {
                const response = await fetch(`/api/node/${nodeId}/update/logs`);
                const data = await response.json();
                
                data.logs.forEach(log => {
                    addLogLine(log.message, log.type);
                });
                
                // Se atualização terminou, parar polling
                if (data.logs.length > 0) {
                    const lastLog = data.logs[data.logs.length - 1];
                    if (lastLog.type === 'success' || lastLog.type === 'error') {
                        clearInterval(updateLogsInterval);
                    }
                }
            } catch (error) {
                console.error('Erro ao buscar logs:', error);
            }
        }

        function addLogLine(message, type = 'log') {
            const log = document.getElementById('updateLog');
            const line = document.createElement('div');
            line.className = `log-line log-${type}`;
            line.textContent = message;
            log.appendChild(line);
            log.scrollTop = log.scrollHeight;
        }

        function closeUpdateModal() {
            document.getElementById('updateModal').classList.remove('active');
            clearInterval(updateLogsInterval);
        }

        // =====================================================
        // NODE DETAILS
        // =====================================================

        async function openNodeDetail(nodeId) {
            try {
                const response = await fetch(`/api/node/${nodeId}/health`);
                const health = await response.json();
                
                const content = document.getElementById('nodeDetailContent');
                document.getElementById('nodeDetailTitle').textContent = `Detalhes - ${nodeId.toUpperCase()}`;
                
                let html = '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">';
                
                // Hardware Info
                html += '<section>';
                html += '<h3 style="margin-bottom: 1rem; color: var(--color-cyan);">🔧 Hardware</h3>';
                
                const mic = health.hardware.microphone;
                html += `<div style="margin-bottom: 1rem;">
                    <strong>Microfone:</strong><br>
                    <span style="color: ${mic.available ? 'var(--color-success)' : 'var(--color-danger)'};">
                        ${mic.available ? '✓ Disponível' : '✗ Não Disponível'}
                    </span>
                </div>`;
                
                const tts = health.hardware.tts;
                html += `<div style="margin-bottom: 1rem;">
                    <strong>TTS:</strong><br>
                    <span style="color: ${tts.available ? 'var(--color-success)' : 'var(--color-danger);}">
                        ${tts.available ? '✓ Disponível' : '✗ Não Disponível'}
                    </span>`;
                if (tts.drivers) {
                    html += `<br><small>Drivers: ${Object.entries(tts.drivers).map(([k, v]) => v ? k : null).filter(Boolean).join(', ') || 'Nenhum'}</small>`;
                }
                html += `</div>`;
                
                const docker = health.hardware.docker;
                html += `<div style="margin-bottom: 1rem;">
                    <strong>Docker:</strong><br>
                    <span style="color: ${docker.available ? 'var(--color-success)' : 'var(--color-gray);};">
                        ${docker.available ? `✓ ${docker.containers} container(s)` : '○ Não disponível'}
                    </span>
                </div>`;
                
                html += '</section>';
                
                // Network & System
                html += '<section>';
                html += '<h3 style="margin-bottom: 1rem; color: var(--color-orange);">🌐 Rede & Sistema</h3>';
                
                const internet = health.hardware.internet;
                html += `<div style="margin-bottom: 1rem;">
                    <strong>Internet:</strong><br>
                    <span style="color: ${internet.available ? 'var(--color-success)' : 'var(--color-danger);};">
                        ${internet.available ? `✓ Online (${internet.latency_ms}ms)` : '✗ Offline'}
                    </span>
                </div>`;
                
                const disk = health.hardware.disk;
                if (Object.keys(disk).length > 0) {
                    html += `<div style="margin-bottom: 1rem;">
                        <strong>Disco:</strong><br>
                        <small>${disk.used_gb}GB / ${disk.total_gb}GB (${disk.usage_percent}%)</small>
                    </div>`;
                }
                
                const memory = health.hardware.memory;
                if (Object.keys(memory).length > 0) {
                    html += `<div>
                        <strong>Memória:</strong><br>
                        <small>${memory.used_mb}MB / ${memory.total_mb}MB (${memory.usage_percent}%)</small>
                    </div>`;
                }
                
                html += '</section></div>';
                
                content.innerHTML = html;
                document.getElementById('nodeDetailModal').classList.add('active');
            } catch (error) {
                console.error('Erro ao carregar detalhes:', error);
            }
        }

        function closeNodeDetailModal() {
            document.getElementById('nodeDetailModal').classList.remove('active');
        }

        // =====================================================
        // COMMAND MANAGER
        // =====================================================

        async function loadCommands() {
            try {
                const response = await fetch('/api/commands');
                const commands = await response.json();
                
                const table = document.getElementById('commandsTable');
                table.innerHTML = '';
                
                commands.forEach(cmd => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="command-name" onclick="editCommand('${cmd.id}')">${cmd.name}</td>
                        <td>${(cmd.size / 1024).toFixed(2)} KB</td>
                        <td>${cmd.lines}</td>
                        <td>
                            <button class="btn btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;" onclick="editCommand('${cmd.id}')">✎ Editar</button>
                            <button class="btn btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.8rem; color: var(--color-danger);" onclick="deleteCommand('${cmd.id}')">🗑 Deletar</button>
                        </td>
                    `;
                    table.appendChild(row);
                });
            } catch (error) {
                console.error('Erro ao carregar comandos:', error);
            }
        }

        function openCreateCommandModal() {
            document.getElementById('commandId').value = '';
            document.getElementById('commandInput').value = '';
            document.getElementById('commandContent').value = '';
            document.getElementById('editorTitle').textContent = 'Novo Comando';
            document.getElementById('commandEditorModal').classList.add('active');
        }

        async function editCommand(commandId) {
            try {
                const response = await fetch(`/api/command/${commandId}`);
                const cmd = await response.json();
                
                document.getElementById('commandId').value = cmd.id;
                document.getElementById('commandInput').value = cmd.id;
                document.getElementById('commandContent').value = cmd.content;
                document.getElementById('editorTitle').textContent = `Editar: ${cmd.name}`;
                document.getElementById('commandEditorModal').classList.add('active');
            } catch (error) {
                console.error('Erro ao carregar comando:', error);
            }
        }

        async function saveCommand() {
            const id = document.getElementById('commandInput').value.trim();
            const content = document.getElementById('commandContent').value.trim();
            
            if (!id || !content) {
                alert('ID e conteúdo são obrigatórios');
                return;
            }
            
            try {
                const response = await fetch('/api/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, content })
                });
                
                const result = await response.json();
                alert(result.message || result.error);
                
                if (result.success) {
                    closeCommandEditor();
                    loadCommands();
                }
            } catch (error) {
                console.error('Erro ao salvar:', error);
            }
        }

        async function deleteCommand(commandId) {
            if (!confirm(`Tem certeza que deseja deletar ${commandId}?`)) return;
            
            try {
                const response = await fetch(`/api/command/${commandId}`, { method: 'DELETE' });
                const result = await response.json();
                alert(result.message || result.error);
                loadCommands();
            } catch (error) {
                console.error('Erro ao deletar:', error);
            }
        }

        function closeCommandEditor() {
            document.getElementById('commandEditorModal').classList.remove('active');
        }

        // Fechar modais ao clicar fora
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                }
            });
        });
    </script>
</body>
</html>
